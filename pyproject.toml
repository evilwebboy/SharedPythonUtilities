[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "shared-python-utilities"
version = "0.1.0"
description = "Reusable Python functions for sports data processing"
requires-python = ">=3.9"

[tool.setuptools.packages.find]
include = ["shared_python_utilities*"]
